<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1f2328; --muted: #656d76;
    --node-fill: #ffffff; --node-stroke: #d0d7de; --edge: #d0d7de;
    --anc: #2563eb; --anc-bg: #dbeafe;   /* 前序 蓝 */
    --desc: #d97706; --desc-bg: #fef3c7; /* 后续 橙 */
    --hover-bg: #1f2328; --hover-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
      --node-fill: #161b22; --node-stroke: #30363d; --edge: #30363d;
      --anc: #58a6ff; --anc-bg: #0d2a52; --desc: #e3b341; --desc-bg: #3a2d10;
      --hover-bg: #e6edf3; --hover-fg: #0d1117;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { max-width: 1150px; margin: 0 auto; padding: 24px 16px 0; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
                         border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-anc::before  { background: var(--anc); }
  .legend .l-desc::before { background: var(--desc); }
  .legend .l-cur::before  { background: var(--hover-bg); }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 8px 8px 40px; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; min-width: 950px; }

  .edge { stroke: var(--edge); stroke-width: 1.4; fill: none; transition: all .15s; }
  .node rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2;
               rx: 8; transition: all .15s; cursor: pointer; }
  .node text { font-size: 13.5px; fill: var(--fg); pointer-events: none; transition: all .15s; }
  .node.strong rect { stroke-width: 2; stroke: var(--fg); }
  .node.strong text { font-weight: 600; }
  .node.corenode rect { fill: var(--anc-bg); }
  .seclab   { font-size: 14px; font-weight: 600; fill: var(--muted); letter-spacing: 2px; }
  .ringlab  { font-size: 11px; fill: var(--muted); letter-spacing: 1px; }
  .corering { fill: none; stroke: var(--node-stroke); stroke-dasharray: 4 5; }

  .dim { opacity: .1; }
  .node.cur rect  { fill: var(--hover-bg); stroke: var(--hover-bg); }
  .node.cur text  { fill: var(--hover-fg); font-weight: 600; }
  .node.anc rect  { fill: var(--anc-bg); stroke: var(--anc); stroke-width: 2; }
  .node.desc rect { fill: var(--desc-bg); stroke: var(--desc); stroke-width: 2; }
  .edge.anc  { stroke: var(--anc); stroke-width: 2.5; }
  .edge.desc { stroke: var(--desc); stroke-width: 2.5; }
</style>
</head>
<body>
<header>
  <h1>Knowledge Graph</h1>
  <div class="hint">同心结构：<b>内环</b> = 三方向共有的数理根基；三个扇区各自<b>分层</b>，外层依赖内层——LLM（上半圆，OS/算法砖聚左、ML 数理聚右近 ESL）：数理化身 → 系统砖 → kernel（FlashAttention / 量化）→ 管线（P0 右起 → P6 左，P4/P5 在 OS 簇上方）；Stochastic（左下）：BM → Itô → Girsanov → 定价 → MC；ESL（右下）同理。
    hover（或点击固定）任意节点：蓝 = 前序链，橙 = 后续链。</div>
  <div class="legend"><span class="l-cur">当前</span><span class="l-anc">前序（它依赖谁）</span><span class="l-desc">后续（谁依赖它）</span></div>
</header>
<div class="wrap"><svg id="g" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script>
/* ================= 通用渲染 ================= */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; }
function measure(s){ let w=0; for (const c of s) w += c.charCodeAt(0)>255 ? 13.5 : 7.5; return w; }

function buildGraph(svg, nodes, edges, edgePath){
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const fwd = {}, rev = {};
  edges.forEach(([a,b]) => { (fwd[a]=fwd[a]||[]).push(b); (rev[b]=rev[b]||[]).push(a); });
  const reach = (id, adj) => { const seen=new Set(), st=[id];
    while(st.length){ const n=st.pop(); for(const m of (adj[n]||[])) if(!seen.has(m)){seen.add(m); st.push(m);} }
    return seen; };

  const edgeEls = edges.map(([a,b]) =>
    ({ a, b, el: el("path",{d: edgePath(byId[a], byId[b]), class:"edge"}, svg) }));
  let pinned = null;
  const nodeEls = nodes.map(n => {
    const base = "node" + (n.strong ? " strong" : "") + (n.core ? " corenode" : "");
    const g = el("g",{class: base}, svg);
    el("rect",{x:n.x, y:n.y, width:n.w, height:n.h, rx:8}, g);
    el("text",{x:n.x+n.w/2, y:n.y+n.h/2+4.5,"text-anchor":"middle"}, g).textContent = n.label;
    g.addEventListener("mouseenter", ()=>{ if(!pinned) show(n.id); });
    g.addEventListener("mouseleave", ()=>{ if(!pinned) clear(); });
    g.addEventListener("click", e=>{ e.stopPropagation();
      if(pinned===n.id){ pinned=null; clear(); } else { pinned=n.id; show(n.id); } });
    return { id:n.id, base, el:g };
  });
  svg.addEventListener("click", ()=>{ pinned=null; clear(); });

  function show(id){
    const anc = reach(id, rev), desc = reach(id, fwd);
    nodeEls.forEach(n => n.el.setAttribute("class",
      n.base + " " + (n.id===id ? "cur" : anc.has(n.id) ? "anc" : desc.has(n.id) ? "desc" : "dim")));
    edgeEls.forEach(e => {
      const isAnc  = anc.has(e.a) && (e.b===id || anc.has(e.b));
      const isDesc = desc.has(e.b) && (e.a===id || desc.has(e.a));
      e.el.setAttribute("class", "edge " + (isAnc ? "anc" : isDesc ? "desc" : "dim"));
    });
  }
  function clear(){
    nodeEls.forEach(n => n.el.setAttribute("class", n.base));
    edgeEls.forEach(e => e.el.setAttribute("class","edge"));
  }
}

/* ================= 数据 =================
   core: 内环 3×2 网格（col: -1/0/1, row: -1/1）
   其余: 极坐标 {a: 角度, r: 半径}，按扇区分层：
   LLM  上半圆  A(数理化身 r400) → B(系统砖 r530) → K(kernel r625) → C(P0–P6 r705)
   STO  左下    L1(r420) → L2(r530) → L3(r635)
   ESL  右下    S1(r420) → S2(r530)                                            */
const NODES = [
  /* 内环 */
  { id:"ce", label:"E[Y|X] 条件期望 / 分布", core:true, col:-1, row:-1 },
  { id:"ct", label:"链式法则 + Taylor",      core:true, col:0,  row:-1 },
  { id:"kl", label:"似然 · softmax · CE · KL", core:true, col:1, row:-1 },
  { id:"la", label:"线代 · 矩阵乘 / SVD",    core:true, col:-1, row:1 },
  { id:"gv", label:"Gaussian · 方差标度",    core:true, col:0,  row:1 },
  { id:"mc", label:"采样 · Monte Carlo",     core:true, col:1,  row:1 },
  /* LLM · A 数理化身（ML 簇靠右，近 ESL）*/
  { id:"attn",     label:"Attention · QKᵀ 前向",    a:-124, r:400 },
  { id:"llm-dec",  label:"Decoding · top-k/p",      a:-104, r:400 },
  { id:"llm-ce",   label:"Cross-entropy · RLHF KL", a:-75,  r:400 },
  { id:"backprop", label:"Backprop / 梯度下降",     a:-60,  r:400 },
  { id:"llm-next", label:"Next-token · 自回归",     a:-44,  r:400 },
  { id:"llm-var",  label:"1/√dₖ · 初始化方差",      a:-28,  r:400 },
  /* LLM · B 系统砖（OS + 算法簇靠左）*/
  { id:"isolation",label:"OS · 隔离 / 存储 WAL",    a:-165, r:530 },
  { id:"ds",       label:"hash / 堆 / 队列",        a:-149, r:545 },
  { id:"trie",     label:"Trie / radix",            a:-133, r:530 },
  { id:"paging",   label:"OS · 分页 / 调度",        a:-117, r:560 },
  { id:"gpu",      label:"GPU · HBM / SRAM 层次",   a:-99,  r:520 },
  { id:"datasci",  label:"Data Sci · 清洗 / 评测",  a:-16,  r:550 },
  /* LLM · K kernel 层 */
  { id:"flash",    label:"FlashAttention · online softmax", a:-118, r:625 },
  { id:"quant",    label:"量化 · fp16 / int8 · PTQ",        a:-96,  r:625 },
  /* LLM · C 管线：P0 从右起（近 ML/数据），P4/P5 落在 OS 簇上方 */
  { id:"p0", label:"P0 数据",             a:-18,  r:705 },
  { id:"p1", label:"P1 预训练",           a:-42,  r:705 },
  { id:"p2", label:"P2 后训练 SFT/RLHF",  a:-66,  r:705 },
  { id:"p3", label:"P3 RL · rollout",     a:-90,  r:705 },
  { id:"p4", label:"P4 Serving 推理引擎", a:-114, r:705, strong:true },
  { id:"p5", label:"P5 Agent Runtime",    a:-138, r:705, strong:true },
  { id:"p6", label:"P6 Safety · 红队",    a:-162, r:705 },
  /* ESL · S1 */
  { id:"esl-mle", label:"MLE · EM · log-loss",     a:18, r:420 },
  { id:"esl-reg", label:"回归函数 · E[Y|X] 逼近",  a:41, r:420 },
  { id:"esl-ols", label:"OLS 投影 · ridge / PCA",  a:64, r:420 },
  { id:"esl-gd",  label:"GD · Newton · 凸性",      a:84, r:420 },
  /* ESL · S2 */
  { id:"esl-cv",   label:"Bootstrap · CV",       a:20, r:530 },
  { id:"esl-bv",   label:"Bias-Variance 分解",   a:45, r:530 },
  { id:"esl-tree", label:"树 · Boosting · RF",   a:70, r:530 },
  /* STO · L1 */
  { id:"st-ito",  label:"Itô 引理 · Greeks",   a:110, r:420 },
  { id:"st-bm",   label:"√t 标度 · lognormal", a:131, r:420 },
  { id:"st-chol", label:"Cholesky · 相关布朗", a:155, r:420 },
  /* STO · L2 */
  { id:"st-gir",  label:"Girsanov · 测度变换",     a:104, r:530 },
  { id:"st-mart", label:"鞅 · 风险中性定价 E^Q",   a:129, r:530 },
  { id:"st-vol",  label:"Vol surface · SVI/SABR",  a:154, r:530 },
  /* STO · L3 */
  { id:"st-mc",   label:"MC 定价 · 方差缩减",      a:128, r:635 },
];

const EDGES = [
  /* 内环 → 各扇区最内层（相邻层，允许直连）*/
  ["ce","llm-next"], ["gv","llm-var"], ["la","attn"], ["ct","backprop"], ["kl","llm-ce"], ["mc","llm-dec"],
  ["kl","esl-mle"], ["ce","esl-reg"], ["la","esl-ols"], ["ct","esl-gd"], ["mc","esl-cv"],
  ["ct","st-ito"], ["gv","st-bm"], ["la","st-chol"],
  /* LLM 扇区内部：A → 管线 / kernel */
  ["llm-next","p1"], ["llm-var","p1"], ["attn","flash"],
  ["backprop","p1"], ["backprop","p2"], ["llm-ce","p3"], ["llm-dec","p4"],
  /* B 系统砖 → kernel / 管线 */
  ["gpu","flash"], ["gpu","quant"],
  ["datasci","p0"], ["datasci","p6"], ["paging","p4"], ["isolation","p5"],
  ["ds","p4"], ["ds","p5"], ["trie","p4"],
  /* kernel → 管线 */
  ["flash","p4"], ["quant","p4"],
  /* 管线 */
  ["p0","p1"], ["p1","p2"], ["p2","p3"], ["p3","p4"], ["p4","p5"], ["p5","p6"],
  /* ESL 内部分层 */
  ["esl-reg","esl-bv"], ["esl-gd","esl-tree"],
  /* STO 内部分层：BM → Itô → Girsanov → 鞅/定价 → MC */
  ["st-bm","st-ito"], ["st-bm","st-vol"],
  ["st-ito","st-gir"], ["st-gir","st-mart"], ["st-mart","st-mc"],
];

/* ================= 布局 ================= */
(function(){
  const W=1510, H=1380, CX=755, CY=770;
  const rad = d => d*Math.PI/180;

  NODES.forEach(n => {
    n.h = 34;
    n.w = Math.max(90, measure(n.label) + 24);
    let cx, cy;
    if (n.core) { cx = CX + n.col*185; cy = CY + n.row*33; }
    else { cx = CX + n.r*Math.cos(rad(n.a)); cy = CY + n.r*Math.sin(rad(n.a)); }
    n.x = cx - n.w/2; n.y = cy - n.h/2; n.cx = cx; n.cy = cy;
  });

  const svg = document.getElementById("g");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el("ellipse", {cx:CX, cy:CY, rx:335, ry:100, class:"corering"}, svg);
  el("text", {x:CX, y:CY-115, "text-anchor":"middle", class:"ringlab"}, svg).textContent = "内环 · 三方向共有";
  /* 扇区文字标签（非节点）*/
  el("text", {x:CX,     y:CY-165, "text-anchor":"middle", class:"seclab"}, svg).textContent = "TRANSFORMER / LLM";
  el("text", {x:CX-285, y:CY+185, "text-anchor":"middle", class:"seclab"}, svg).textContent = "STOCHASTIC CALC";
  el("text", {x:CX+285, y:CY+185, "text-anchor":"middle", class:"seclab"}, svg).textContent = "ESL / ISL";

  const path = (A,B) => {
    const mx=(A.cx+B.cx)/2, my=(A.cy+B.cy)/2;
    const qx = mx + (CX-mx)*0.12, qy = my + (CY-my)*0.12;
    return `M${A.cx},${A.cy} Q${qx},${qy} ${B.cx},${B.cy}`;
  };
  buildGraph(svg, NODES, EDGES, path);
})();
</script>
</body>
</html>
