<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1f2328; --muted: #656d76;
    --node-fill: #ffffff; --node-stroke: #d0d7de; --edge: #d0d7de;
    --anc: #2563eb; --anc-bg: #dbeafe;   /* 前序 蓝 */
    --desc: #d97706; --desc-bg: #fef3c7; /* 后续 橙 */
    --hover-bg: #1f2328; --hover-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e;
      --node-fill: #161b22; --node-stroke: #30363d; --edge: #30363d;
      --anc: #58a6ff; --anc-bg: #0d2a52; --desc: #e3b341; --desc-bg: #3a2d10;
      --hover-bg: #e6edf3; --hover-fg: #0d1117;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { max-width: 1150px; margin: 0 auto; padding: 24px 16px 0; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px;
                         border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-anc::before  { background: var(--anc); }
  .legend .l-desc::before { background: var(--desc); }
  .legend .l-cur::before  { background: var(--hover-bg); }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 8px 8px 40px; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; min-width: 950px; }

  .edge { stroke: var(--edge); stroke-width: 1.4; fill: none; transition: all .15s; }
  .node rect { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1.2;
               rx: 8; transition: all .15s; cursor: pointer; }
  .node text { font-size: 13.5px; fill: var(--fg); pointer-events: none; transition: all .15s; }
  .node.strong rect { stroke-width: 2; stroke: var(--fg); }
  .node.strong text { font-weight: 600; }
  .node.corenode rect { fill: var(--anc-bg); }
  .ringlab  { font-size: 11px; fill: var(--muted); letter-spacing: 1px; }
  .corering { fill: none; stroke: var(--node-stroke); stroke-dasharray: 4 5; }

  .dim { opacity: .1; }
  .node.cur rect  { fill: var(--hover-bg); stroke: var(--hover-bg); }
  .node.cur text  { fill: var(--hover-fg); font-weight: 600; }
  .node.anc rect  { fill: var(--anc-bg); stroke: var(--anc); stroke-width: 2; }
  .node.desc rect { fill: var(--desc-bg); stroke: var(--desc); stroke-width: 2; }
  .edge.anc  { stroke: var(--anc); stroke-width: 2.5; }
  .edge.desc { stroke: var(--desc); stroke-width: 2.5; }
</style>
</head>
<body>
<header>
  <h1>Knowledge Graph</h1>
  <div class="hint">同心结构：<b>内环</b> = 三方向共有的数理根基（直连三个方向）；<b>中环</b> = 三个面试方向；<b>外环</b> = 各方向独有知识——LLM 扇区占上半圆，含系统砖与 P0–P6 管线（P4/P5 主攻带加粗）。
    hover 内环节点 = 同一概念在三方向的化身；hover 方向 hub = 该方向全部知识；点击可固定。蓝 = 前序，橙 = 后续。</div>
  <div class="legend"><span class="l-cur">当前</span><span class="l-anc">前序（它依赖谁）</span><span class="l-desc">后续（谁依赖它）</span></div>
</header>
<div class="wrap"><svg id="g" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script>
/* ================= 通用渲染 ================= */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; }
function measure(s){ let w=0; for (const c of s) w += c.charCodeAt(0)>255 ? 13.5 : 7.5; return w; }

function buildGraph(svg, nodes, edges, edgePath){
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const fwd = {}, rev = {};
  edges.forEach(([a,b]) => { (fwd[a]=fwd[a]||[]).push(b); (rev[b]=rev[b]||[]).push(a); });
  const reach = (id, adj) => { const seen=new Set(), st=[id];
    while(st.length){ const n=st.pop(); for(const m of (adj[n]||[])) if(!seen.has(m)){seen.add(m); st.push(m);} }
    return seen; };

  const edgeEls = edges.map(([a,b]) =>
    ({ a, b, el: el("path",{d: edgePath(byId[a], byId[b]), class:"edge"}, svg) }));
  let pinned = null;
  const nodeEls = nodes.map(n => {
    const base = "node" + (n.strong ? " strong" : "") + (n.core ? " corenode" : "");
    const g = el("g",{class: base}, svg);
    el("rect",{x:n.x, y:n.y, width:n.w, height:n.h, rx:8}, g);
    el("text",{x:n.x+n.w/2, y:n.y+n.h/2+4.5,"text-anchor":"middle"}, g).textContent = n.label;
    g.addEventListener("mouseenter", ()=>{ if(!pinned) show(n.id); });
    g.addEventListener("mouseleave", ()=>{ if(!pinned) clear(); });
    g.addEventListener("click", e=>{ e.stopPropagation();
      if(pinned===n.id){ pinned=null; clear(); } else { pinned=n.id; show(n.id); } });
    return { id:n.id, base, el:g };
  });
  svg.addEventListener("click", ()=>{ pinned=null; clear(); });

  function show(id){
    const anc = reach(id, rev), desc = reach(id, fwd);
    nodeEls.forEach(n => n.el.setAttribute("class",
      n.base + " " + (n.id===id ? "cur" : anc.has(n.id) ? "anc" : desc.has(n.id) ? "desc" : "dim")));
    edgeEls.forEach(e => {
      const isAnc  = anc.has(e.a) && (e.b===id || anc.has(e.b));
      const isDesc = desc.has(e.b) && (e.a===id || desc.has(e.a));
      e.el.setAttribute("class", "edge " + (isAnc ? "anc" : isDesc ? "desc" : "dim"));
    });
  }
  function clear(){
    nodeEls.forEach(n => n.el.setAttribute("class", n.base));
    edgeEls.forEach(e => e.el.setAttribute("class","edge"));
  }
}

/* ================= 数据 ================= */
/* 内环 core：三方向共有（shared foundations 表的行） */
/* 外环：ring + slot 定位；LLM 占上半圆三条弧（A 数理化身 / B 系统砖 / C P0–P6 管线） */
const NODES = [
  /* 内环 */
  { id:"ce", label:"E[Y|X] 条件期望 / 分布", core:true },
  { id:"la", label:"线代 · 矩阵乘 / SVD",    core:true },
  { id:"ct", label:"链式法则 + Taylor",      core:true },
  { id:"gv", label:"Gaussian · 方差标度",    core:true },
  { id:"kl", label:"似然 · softmax · CE · KL", core:true },
  { id:"mc", label:"采样 · Monte Carlo",     core:true },
  /* 中环 hubs */
  { id:"LLM", label:"Transformer / LLM",  hub:"llm", strong:true },
  { id:"ESL", label:"ESL / ISL 统计学习", hub:"esl", strong:true },
  { id:"STO", label:"Stochastic Calculus", hub:"sto", strong:true },
  /* LLM 扇区 · 弧 A（数理化身）*/
  { id:"llm-next", label:"Next-token · 自回归",       sector:"llm", ring:"A", slot:0 },
  { id:"attn",     label:"Attention · QKᵀ 前向",      sector:"llm", ring:"A", slot:1 },
  { id:"backprop", label:"Backprop / 梯度下降",       sector:"llm", ring:"A", slot:2 },
  { id:"llm-var",  label:"1/√dₖ · 初始化方差",        sector:"llm", ring:"A", slot:3 },
  { id:"llm-ce",   label:"Cross-entropy · RLHF KL",   sector:"llm", ring:"A", slot:4 },
  { id:"llm-dec",  label:"Decoding · top-k/p",        sector:"llm", ring:"A", slot:5 },
  /* LLM 扇区 · 弧 B（系统砖）*/
  { id:"ds",       label:"hash / 堆 / Trie / radix",  sector:"llm", ring:"B", slot:0 },
  { id:"paging",   label:"OS · 分页 / 调度 / 抢占",    sector:"llm", ring:"B", slot:1 },
  { id:"gpu",      label:"GPU · HBM / SRAM 层次",     sector:"llm", ring:"B", slot:2 },
  { id:"flash",    label:"FlashAttention · online softmax", sector:"llm", ring:"B", slot:3 },
  { id:"quant",    label:"量化 · fp16 / int8 · PTQ",  sector:"llm", ring:"B", slot:4 },
  { id:"isolation",label:"OS · 隔离 / 存储 WAL",      sector:"llm", ring:"B", slot:5 },
  { id:"datasci",  label:"Data Sci · 清洗 / 评测",    sector:"llm", ring:"B", slot:6 },
  /* LLM 扇区 · 弧 C（P0–P6 管线）*/
  { id:"p0", label:"P0 数据",              sector:"llm", ring:"C", slot:0 },
  { id:"p1", label:"P1 预训练",            sector:"llm", ring:"C", slot:1 },
  { id:"p2", label:"P2 后训练 SFT/RLHF",   sector:"llm", ring:"C", slot:2 },
  { id:"p3", label:"P3 RL · rollout",      sector:"llm", ring:"C", slot:3 },
  { id:"p4", label:"P4 Serving 推理引擎",  sector:"llm", ring:"C", slot:4, strong:true },
  { id:"p5", label:"P5 Agent Runtime",     sector:"llm", ring:"C", slot:5, strong:true },
  { id:"p6", label:"P6 Safety · 红队",     sector:"llm", ring:"C", slot:6 },
  /* ESL 扇区（双弧）*/
  { id:"esl-reg",  label:"回归函数 · E[Y|X] 逼近",  sector:"esl", ring:"S1", slot:0 },
  { id:"esl-ols",  label:"OLS 投影 · ridge / PCA", sector:"esl", ring:"S1", slot:1 },
  { id:"esl-gd",   label:"GD · Newton · 凸性",     sector:"esl", ring:"S1", slot:2 },
  { id:"esl-bv",   label:"Bias-Variance 分解",     sector:"esl", ring:"S1", slot:3 },
  { id:"esl-tree", label:"树 · Boosting · RF",     sector:"esl", ring:"S2", slot:0 },
  { id:"esl-mle",  label:"MLE · EM · log-loss",    sector:"esl", ring:"S2", slot:1 },
  { id:"esl-cv",   label:"Bootstrap · CV",         sector:"esl", ring:"S2", slot:2 },
  /* Stochastic 扇区（双弧）*/
  { id:"st-mart", label:"鞅 · 风险中性定价 E^Q",   sector:"sto", ring:"S1", slot:0 },
  { id:"st-chol", label:"Cholesky · 相关布朗",     sector:"sto", ring:"S1", slot:1 },
  { id:"st-ito",  label:"Itô 引理 · Greeks",       sector:"sto", ring:"S1", slot:2 },
  { id:"st-bm",   label:"√t 标度 · lognormal",     sector:"sto", ring:"S1", slot:3 },
  { id:"st-vol",  label:"Vol surface · SVI/SABR",  sector:"sto", ring:"S2", slot:0 },
  { id:"st-gir",  label:"Girsanov · 测度变换",     sector:"sto", ring:"S2", slot:1 },
  { id:"st-mc",   label:"MC 定价 · 方差缩减",      sector:"sto", ring:"S2", slot:2 },
];

const EDGES = [
  /* 内环 → 三个方向 hub（根基直连方向）*/
  ["ce","LLM"],["la","LLM"],["ct","LLM"],["gv","LLM"],["kl","LLM"],["mc","LLM"],
  ["ce","ESL"],["la","ESL"],["ct","ESL"],["gv","ESL"],["kl","ESL"],["mc","ESL"],
  ["ce","STO"],["la","STO"],["ct","STO"],["gv","STO"],["kl","STO"],["mc","STO"],
  /* 内环 → 各方向化身（表格的 cell）*/
  ["ce","llm-next"], ["la","attn"], ["ct","backprop"], ["gv","llm-var"], ["kl","llm-ce"], ["mc","llm-dec"],
  ["ce","esl-reg"], ["la","esl-ols"], ["ct","esl-gd"], ["gv","esl-bv"], ["kl","esl-mle"], ["mc","esl-cv"],
  ["ce","st-mart"], ["la","st-chol"], ["ct","st-ito"], ["gv","st-bm"], ["kl","st-gir"], ["mc","st-mc"],
  /* LLM 扇区内部依赖（原图二，去重后）*/
  ["llm-next","p1"], ["attn","flash"], ["backprop","p1"], ["backprop","p2"],
  ["llm-var","p1"], ["llm-ce","p2"], ["llm-dec","p4"],
  ["ds","p4"], ["ds","p5"], ["paging","p4"], ["gpu","flash"], ["gpu","quant"],
  ["flash","p4"], ["quant","p4"], ["isolation","p5"], ["datasci","p0"], ["datasci","p6"],
  ["p0","p1"], ["p1","p2"], ["p2","p3"], ["p3","p4"], ["p4","p5"], ["p5","p6"],
  ["p6","LLM"],                                   /* 管线收口回 LLM 方向 */
  /* ESL / STO 扇区 → 各自 hub */
  ["esl-reg","ESL"],["esl-ols","ESL"],["esl-gd","ESL"],["esl-tree","ESL"],
  ["esl-bv","ESL"],["esl-mle","ESL"],["esl-cv","ESL"],
  ["st-mart","STO"],["st-chol","STO"],["st-ito","STO"],["st-vol","STO"],
  ["st-bm","STO"],["st-gir","STO"],["st-mc","STO"],
];

/* ================= 布局 ================= */
(function(){
  const W=1480, H=1380, CX=740, CY=770;
  const rad = d => d*Math.PI/180;
  const HUB = { llm:{a:-90, r:295}, esl:{a:52, r:295}, sto:{a:128, r:295} };
  const RING = {
    "llm-A":  { r:430, start:-152, step:25 },
    "llm-B":  { r:565, start:-165, step:25 },
    "llm-C":  { r:695, start:-162, step:24 },
    "esl-S1": { r:450, start:18,  step:19 },
    "esl-S2": { r:575, start:25,  step:24 },
    "sto-S1": { r:450, start:105, step:19 },
    "sto-S2": { r:575, start:107, step:24 },
  };

  NODES.forEach(n => {
    n.h = 34;
    n.w = Math.max(90, measure(n.label) + (n.hub ? 40 : 24));
    let cx, cy;
    if (n.core) {
      const i = NODES.filter(m=>m.core).indexOf(n);
      cx = CX + (i%2===0 ? -118 : 118);
      cy = CY + (Math.floor(i/2)-1)*54;
    } else if (n.hub) {
      const h = HUB[n.hub];
      cx = CX + h.r*Math.cos(rad(h.a)); cy = CY + h.r*Math.sin(rad(h.a));
    } else {
      const cfg = RING[n.sector+"-"+n.ring];
      const a = rad(cfg.start + cfg.step*n.slot);
      cx = CX + cfg.r*Math.cos(a); cy = CY + cfg.r*Math.sin(a);
    }
    n.x = cx - n.w/2; n.y = cy - n.h/2; n.cx = cx; n.cy = cy;
  });

  const svg = document.getElementById("g");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el("ellipse", {cx:CX, cy:CY, rx:265, ry:128, class:"corering"}, svg);
  el("text", {x:CX, y:CY-143, "text-anchor":"middle", class:"ringlab"}, svg).textContent = "内环 · 三方向共有";

  const path = (A,B) => {
    const mx=(A.cx+B.cx)/2, my=(A.cy+B.cy)/2;
    const qx = mx + (CX-mx)*0.12, qy = my + (CY-my)*0.12;
    return `M${A.cx},${A.cy} Q${qx},${qy} ${B.cx},${B.cy}`;
  };
  buildGraph(svg, NODES, EDGES, path);
})();
</script>
</body>
</html>
